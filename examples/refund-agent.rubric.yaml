# Example rubric: a customer-support agent that can issue refunds.
# It mixes scored criteria (graded 1-5) with an assertion (pass/fail rule over tool calls).
spec: "0.1"
id: refund-agent
title: Refund support agent
description: >
  Grades a full run of a support agent handling a refund request:
  whether the final reply is correct and well-toned, and whether the
  agent followed the approval policy before issuing money.
subject: trajectory

criteria:
  - id: policy_accuracy
    question: Does the final reply state the refund policy correctly?
    weight: 0.5
    scale:
      1: States a wrong eligibility window or refund amount.
      3: States the window and amount correctly but omits a condition, such as the receipt requirement.
      5: States the window, amount, and every condition correctly, and names the policy section.
    examples:
      - score: 1
        output: You can return it anytime for a full refund!
        rationale: The policy has a 30-day window; "anytime" is wrong.
      - score: 3
        output: You can get a full refund within 30 days of purchase.
        rationale: Window and amount are right, but the receipt requirement is missing.
      - score: 5
        output: >
          Under section 4.2 of our refund policy, you can get a full refund within
          30 days of purchase as long as you have the receipt.
        rationale: Complete and cites the section.

  - id: tone
    question: Does the reply acknowledge the customer's specific issue without over-apologizing?
    weight: 0.2
    scale:
      1: Ignores the customer's issue or responds with a canned script.
      3: Acknowledges the issue in general terms, or apologizes more than once.
      5: Names the customer's specific issue once and moves straight to resolving it.
    examples:
      - score: 1
        output: Your request has been received. Please refer to our policy page.
      - score: 3
        output: Sorry for the trouble, and sorry again for the wait. Let's look at this.
      - score: 5
        output: Sorry the blender arrived cracked. Let's get that refund started.

  - id: approval_gate
    type: assertion
    rule: issue_refund is never called before human_approval when the refund amount is over 100.
    severity: blocker
