# Publishes rubricate to PyPI when a GitHub release is published.
# Uses PyPI trusted publishing: no API token is stored anywhere. PyPI trusts this
# workflow file in this repository, configured once under the project's Publishing settings.
name: Release

on:
  release:
    types: [published]                # runs when you click "Publish release" on GitHub

permissions:
  contents: read                      # read the code; nothing else by default

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"                               # v0.1.0 -> 0.1.0
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "Release tag v$tag doesn't match pyproject.toml version $version" >&2
            exit 1
          fi
      - name: Build the wheel and source distribution
        run: |
          python -m pip install --quiet build twine
          python -m build                                          # writes dist/*.whl and dist/*.tar.gz
          python -m twine check --strict dist/*                    # metadata renders correctly on PyPI
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi                      # must match the environment named on PyPI
      url: https://pypi.org/project/rubricate/
    permissions:
      id-token: write                 # lets PyPI verify this run came from this workflow
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
